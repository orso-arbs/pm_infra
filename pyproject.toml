[project]
name = "pm_infra"
version = "0.1.0"
description = "Local meeting transcription: recordings in, transcripts filed per meeting."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "faster-whisper>=1.1",
    "pyannote.audio>=3.3,<4",
    "torch>=2.6,<2.9",
    "torchaudio>=2.6,<2.9",
    "soundfile>=0.12",
    "huggingface_hub>=0.25,<1",
    "pystray>=0.19",
    "pillow>=10",
    "psutil>=6",
    "pyyaml>=6",
]

[project.scripts]
pm_infra = "pm_infra.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pm_infra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
